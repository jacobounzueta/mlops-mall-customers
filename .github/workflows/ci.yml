name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  quality:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar estilo y errores comunes
        run: ruff check src api app tests scripts

      - name: Verificar formato
        run: ruff format --check src api app tests scripts

      - name: Ejecutar tests
        run: pytest

  pipeline:
    name: Pipeline de datos y clustering
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Limpiar y validar dataset (sin descargar)
        run: python -m src.data --no-download

      - name: Construir segmentos con KMeans
        run: python -m src.clustering

      - name: Verificar artefactos del pipeline
        run: |
          python -c "
          from pathlib import Path
          expected = [
              Path('data/processed/mall_customers_processed.csv'),
              Path('data/processed/mall_customers_segmented.csv'),
              Path('reports/metrics/segment_labels.json'),
              Path('reports/metrics/clustering_metrics.json'),
              Path('reports/figures/customer_segments_pca.png'),
          ]
          missing = [str(path) for path in expected if not path.exists()]
          assert not missing, f'Faltan artefactos: {missing}'
          print('Artefactos OK:', len(expected))
          "

      - name: Publicar figuras
        uses: actions/upload-artifact@v4
        with:
          name: figuras-segmentacion
          path: reports/figures/
          retention-days: 7

  docker:
    name: Build de la imagen de la API
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar docker-compose
        run: docker compose config -q

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          tags: mlops-mall-customers-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
